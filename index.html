<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<title>宝贝Math小跑计划</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  :root{
    --bg:#F5F7FA;
    --surface:#FFFFFF;
    --ink:#0F172A;
    --ink-secondary:#475569;
    --ink-tertiary:#94A3B8;
    --primary:#3B82F6;
    --primary-d:#2563EB;
    --primary-soft:#EFF6FF;
    --accent:#FB923C;
    --accent-soft:#FFF7ED;
    --line:#E2E8F0;
    --ok:#22C55E;
    --warn:#EF4444;
    --warn-soft:#FEF2F2;
    --t0:#FB923C;
    --t1:#3B82F6;
    --t2:#22C55E;
    --shadow-sm:0 1px 2px rgba(15,23,42,.04);
    --shadow:0 4px 16px rgba(15,23,42,.06);
    --shadow-lg:0 12px 32px rgba(15,23,42,.12);
    --radius-sm:10px;
    --radius:16px;
    --radius-lg:20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.55;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:14px 14px 24px}
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 16px 10px;max-width:760px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--ink)}
  .brand svg{width:30px;height:30px}
  .store{font-size:12px;color:var(--ink-tertiary);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600}
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    display:flex;background:#fff;border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
    max-width:760px;margin:0 auto;
    box-shadow:0 -4px 20px rgba(15,23,42,.04);
  }
  nav.tabs button{
    flex:1;border:none;background:none;padding:10px 0 8px;cursor:pointer;
    color:var(--ink-tertiary);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;
    transition:color .15s ease;
  }
  nav.tabs button svg{width:24px;height:24px;transition:transform .15s ease}
  nav.tabs button.active{color:var(--primary-d);font-weight:800}
  nav.tabs button.active svg{transform:translateY(-1px)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:14px;box-shadow:var(--shadow);transition:box-shadow .2s ease}
  .card:hover{box-shadow:var(--shadow-lg)}
  .card h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px;color:var(--ink)}
  .card h3 .bar{width:4px;height:16px;background:var(--primary);border-radius:3px;display:inline-block}
  .seg{display:flex;background:var(--primary-soft);border-radius:999px;padding:4px;max-width:340px;margin:0 auto}
  .seg button{flex:1;border:none;background:none;padding:9px 0;border-radius:999px;font-weight:700;color:var(--ink-secondary);cursor:pointer;font-size:15px;transition:all .15s ease}
  .seg button.active{background:#fff;color:var(--primary-d);box-shadow:var(--shadow-sm)}
  /* 周期时间切换 */
  .period-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 0;max-width:360px}
  .period-nav .pn-btn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:50%;font-size:20px;font-weight:800;color:var(--primary-d);cursor:pointer;line-height:1;transition:all .15s ease;box-shadow:var(--shadow-sm)}
  .period-nav .pn-btn:active{background:var(--primary-soft);transform:scale(.96)}
  .period-nav .pn-label{font-size:14px;font-weight:800;color:var(--ink);min-width:130px;text-align:center}
  .period-nav .pn-today{border:1px solid var(--line);background:#fff;color:var(--ink-secondary);border-radius:999px;padding:7px 14px;font-size:12px;cursor:pointer;white-space:nowrap;font-weight:600;transition:all .15s ease}
  .period-nav .pn-today:active{background:var(--primary-soft)}
  /* 诊断页顶部吸顶：日周月 + 时间选择 */
  .diag-sticky{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    padding:10px 0 10px;
    margin:-4px 0 0;
    border-bottom:1px solid transparent;
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  .diag-sticky.stuck{border-bottom-color:var(--line);box-shadow:0 6px 14px rgba(15,23,42,.04)}
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
  .stat{background:var(--primary-soft);border-radius:var(--radius-sm);padding:14px 6px;text-align:center;transition:transform .15s ease}
  .stat:active{transform:scale(.98)}
  .stat .v{font-size:22px;font-weight:800;color:var(--primary-d);line-height:1.1}
  .stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)}
  .stat .v.t0{color:var(--t0)} .stat .v.t1{color:var(--t1)} .stat .v.t2{color:var(--t2)}
  .stat .l{font-size:12px;color:var(--ink-secondary);margin-top:4px;font-weight:600}
  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:14px;font-size:13px;color:var(--ink)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .chart-flex{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
  .chart-flex .donut-box{flex:1;min-width:180px;text-align:center}
  .chart-flex .legend{flex:1;min-width:200px}
  svg.chart{width:100%;height:auto;display:block}
  label.fld{display:block;margin-bottom:18px}
  label.fld .lab{font-size:14px;font-weight:700;margin-bottom:8px;display:block;color:var(--ink)}
  .req{color:var(--warn)}
  .hint{font-size:12px;color:var(--ink-tertiary);margin:-4px 0 10px}
  .lab .badge{
    font-size:11px;font-weight:600;color:var(--primary-d);background:var(--primary-soft);
    border:1px solid #BFDBFE;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px
  }
  /* 二级字段（知识点）：缩进 + 左侧连接线，体现层级 */
  .fld-sub{padding-left:16px;margin-left:2px;border-left:2px solid var(--line);transition:border-color .2s}
  .fld-sub.locked{border-left-style:dashed;border-left-color:#CBD5E1}
  .fld-sub.locked .addrow{opacity:.45;pointer-events:none}
  .kp-locked{
    display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:36px;border:1px dashed #CBD5E1;background:#F8FAFC;color:#94A3B8;
    border-radius:var(--radius-sm);cursor:pointer
  }
  .kp-locked:active{background:#F1F5F9}
  input[type=date],input[type=number]{
    width:100%;padding:13px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);
    font-size:16px;background:#fff;color:var(--ink);transition:border-color .15s ease,box-shadow .15s ease
  }
  textarea{
    width:100%;padding:13px;border:1px solid var(--line);border-radius:var(--radius-sm);
    font-size:15px;background:#fff;color:var(--ink);resize:vertical;
    min-height:88px;line-height:1.55;font-family:inherit;transition:border-color .15s ease,box-shadow .15s ease
  }
  textarea:focus,input[type=date]:focus,input[type=number]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
  .radio-row{display:flex;gap:10px}
  .radio-row label{
    flex:1;text-align:center;padding:13px 0;border:1px solid var(--line);border-radius:var(--radius-sm);
    cursor:pointer;font-weight:700;color:var(--ink-secondary);background:#fff;transition:all .15s ease
  }
  .radio-row input{display:none}
  .radio-row input:checked + span{color:var(--primary-d)}
  .radio-row label:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--primary-d)}
  .radio-row label:active{transform:scale(.98)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .chip{
    padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;
    font-size:14px;cursor:pointer;color:var(--ink);user-select:none;transition:all .12s ease;font-weight:500
  }
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700;box-shadow:var(--shadow-sm)}
  .chip.custom{background:var(--accent-soft);border-color:#FED7AA;color:#C2410C}
  .chip.custom.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .x{margin-left:6px;font-weight:800;opacity:.8}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:15px;transition:border-color .15s ease}
  .addrow input:focus{outline:none;border-color:var(--primary)}
  .addrow button{border:none;background:var(--accent);color:#fff;border-radius:var(--radius-sm);padding:0 16px;font-weight:700;cursor:pointer;transition:filter .15s ease,transform .15s ease}
  .addrow button:active{transform:scale(.97);filter:brightness(.95)}
  .submit{
    width:100%;margin-top:6px;padding:16px;border:none;border-radius:var(--radius-sm);background:var(--primary);
    color:#fff;font-size:17px;font-weight:800;cursor:pointer;transition:all .15s ease;box-shadow:0 4px 14px rgba(37,99,235,.25)
  }
  .submit:hover{background:var(--primary-d)}
  .submit:active{transform:scale(.99);box-shadow:0 2px 8px rgba(37,99,235,.2)}
  .submit:disabled{opacity:.6;cursor:default}
  .form-err{color:var(--warn);font-size:13px;min-height:18px;margin:-6px 0 10px;font-weight:600}
  .toast{
    position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(15,23,42,.92);color:#fff;
    padding:12px 20px;border-radius:var(--radius-sm);font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none;font-weight:500;box-shadow:var(--shadow-lg)
  }
  .toast.show{opacity:1}
  /* 照片上传 */
  .up-row{display:flex;gap:10px;flex-wrap:wrap}
  .upload-btn{
    display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--primary);color:var(--primary-d);
    background:#fff;border-radius:var(--radius-sm);padding:12px 17px;cursor:pointer;font-weight:700;font-size:14px;transition:all .15s ease
  }
  .upload-btn:hover{background:var(--primary-soft)}
  .upload-btn:active{transform:scale(.98)}
  .photos{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .photo-thumb{position:relative;width:88px;height:88px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);background:#EDF2F7;box-shadow:var(--shadow-sm)}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer;transition:transform .2s ease}
  .photo-thumb:hover img{transform:scale(1.03)}
  .photo-thumb .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(15,23,42,.55);color:#fff;border:none;font-size:14px;line-height:24px;cursor:pointer;padding:0;transition:background .15s ease}
  .photo-thumb .rm:hover{background:rgba(15,23,42,.75)}
  /* 错题本 */
  .book-filter{position:sticky;top:0;z-index:15;background:var(--surface);padding:4px 0 12px;margin:-2px 0 12px;border-bottom:1px solid transparent;transition:border-color .15s ease}
  .book-filter.stuck{border-bottom-color:var(--line)}
  .book-filter .chips{margin-bottom:0}
  .book-summary{font-size:13px;color:var(--ink-secondary);margin:0 0 14px;font-weight:600}
  .list-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:4px}
  .tool-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:var(--radius-sm);padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600;transition:all .15s ease}
  .tool-btn:hover{border-color:#CBD5E1;background:#F8FAFC}
  .tool-btn.warn{border-color:#FECACA;color:var(--warn);background:var(--warn-soft)}
  .tool-btn.warn:hover{background:#FEE2E2}
  .kp-group{margin-top:14px}
  .kp-group h4{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;color:var(--ink)}
  .kp-group h4 .cnt{font-size:12px;color:var(--ink-tertiary);font-weight:600}
  .errcard{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:#fff;margin-bottom:10px}
  .errcard .ec-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
  .errcard .ec-date{font-weight:800}
  .errcard .ec-type{font-size:12px;color:#fff;background:var(--primary);border-radius:999px;padding:3px 10px}
  .errcard .ec-sub{font-size:13px;color:var(--ink-secondary);margin:6px 0}
  .errcard .ec-desc,.rec .desc{
    font-size:13px;color:var(--ink);background:var(--primary-soft);border-radius:var(--radius-sm);
    padding:10px 12px;margin:8px 0;white-space:pre-wrap;word-break:break-word
  }
  .errcard .ec-photos{display:flex;flex-wrap:wrap;gap:6px}
  .errcard .ec-photos img{width:72px;height:72px;border-radius:10px;object-fit:cover;cursor:pointer;border:1px solid var(--line)}
  .tag-btns{display:flex;gap:6px;margin-top:10px}
  .tag-btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);padding:9px 0;font-size:13px;cursor:pointer;font-weight:700;color:var(--ink-secondary);transition:all .15s ease}
  .tag-btn.on.t0{background:var(--t0);border-color:var(--t0);color:#fff}
  .tag-btn.on.t1{background:var(--t1);border-color:var(--t1);color:#fff}
  .tag-btn.on.t2{background:var(--t2);border-color:var(--t2);color:#fff}
  .tag-btn:not(.on):hover{background:#F8FAFC}
  .del{border:none;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:700;transition:background .15s ease}
  .del:hover{background:#FEE2E2}
  .rec{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-top:12px;background:#fff;box-shadow:var(--shadow-sm);transition:box-shadow .15s ease}
  .rec:hover{box-shadow:var(--shadow)}
  .rec .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .rec .top .rec-actions{display:flex;gap:8px;align-items:center;flex:none}
  .rec-edit{border:1px solid #BFDBFE;background:var(--primary-soft);color:var(--primary-d);border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:700;transition:background .15s ease}
  .rec-edit:hover{background:#DBEAFE}
  .rec .date{font-weight:800;color:var(--ink)}
  .rec .type{font-size:12px;color:#fff;background:var(--primary);border-radius:999px;padding:3px 10px}
  .rec .meta{font-size:13px;color:var(--ink-secondary);margin:6px 0}
  .rec .acc{color:var(--ok);font-weight:700}
  .rec .acc.low{color:var(--warn)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .tag{font-size:12px;background:var(--primary-soft);color:var(--primary-d);border-radius:8px;padding:3px 10px;font-weight:600}
  .tag.r{background:var(--warn-soft);color:var(--warn)}
  .tag.k{background:#F0FDF4;color:var(--ok)}
  .empty{text-align:center;color:var(--ink-tertiary);padding:44px 0;font-size:14px;font-weight:500}
  .ver{text-align:center;color:#CBD5E1;font-size:12px;margin:24px 0 6px}
  .ver-refresh{border:none;background:none;color:var(--primary-d);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;font-weight:600}
  /* ===== 错题列表项（可点击）===== */
  .q-list{display:block}
  .q-item{
    display:flex;gap:12px;align-items:stretch;background:var(--surface);
    border:1px solid var(--line);border-left:4px solid var(--t0);
    border-radius:var(--radius);padding:14px 14px 14px 15px;margin-bottom:12px;cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
    box-shadow:var(--shadow-sm)
  }
  .q-item.t1{border-left-color:var(--t1)}
  .q-item.t2{border-left-color:var(--t2)}
  .q-item:active{transform:scale(.99);box-shadow:var(--shadow)}
  .q-item:hover{box-shadow:var(--shadow);border-color:#CBD5E1}
  .q-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .q-top{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .q-date{font-weight:800;font-size:14px;color:var(--ink)}
  .q-type{font-size:11px;color:#fff;background:var(--primary);border-radius:999px;padding:3px 10px;flex:none;font-weight:700}
  .q-meta{font-size:12.5px;color:var(--ink-secondary);line-height:1.6;margin-top:3px;display:flex;align-items:flex-start;gap:5px}
  .q-meta .mk{color:var(--ink-tertiary);flex:none;font-weight:600;background:#F1F5F9;border-radius:4px;padding:0 5px;font-size:11.5px;line-height:1.7;margin-top:1px}
  .q-meta .mv{word-break:break-word}
  .q-desc{font-size:12.5px;color:var(--ink);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--primary-soft);padding:5px 9px;border-radius:8px}
  .q-side{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:8px;flex:none}
  .q-metarow{display:flex;align-items:center;gap:8px}
  .q-tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--t0);color:#fff;white-space:nowrap;flex:none}
  .q-tag.t1{background:var(--t1)}
  .q-tag.t2{background:var(--t2)}
  .q-arrow{width:18px;height:18px;color:#CBD5E1;flex:none}
  /* 有图：图片整块贴右侧、铺满卡片高度，卡片以图为主 */
  .q-item.has-img{padding:0;align-items:stretch;overflow:hidden;min-height:118px}
  .q-item.has-img .q-main{display:flex;flex-direction:column;padding:14px 12px 14px 15px;justify-content:space-between}
  .q-item.has-img .q-tag{margin-top:auto;align-self:flex-start}
  .q-media{flex:none;width:38%;min-width:118px;max-width:168px;align-self:stretch;position:relative;background:#EDF2F7}
  .q-media img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .q-photocount{position:absolute;right:8px;bottom:8px;background:rgba(15,23,42,.55);color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:2px 8px;line-height:1.6}
  /* ===== 错题详情卡片（弹层 + 左右滑动）===== */
  .detail{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
  .detail-mask{position:absolute;inset:0;background:rgba(15,23,42,.5)}
  .detail-card{
    position:relative;width:100%;max-width:460px;max-height:88vh;background:#fff;
    border-radius:var(--radius-lg);display:flex;flex-direction:column;overflow:hidden;
    box-shadow:var(--shadow-lg);animation:dPop .22s cubic-bezier(.22,.61,.36,1);touch-action:pan-y
  }
  @keyframes dPop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .d-head{display:flex;align-items:center;gap:4px;padding:12px 14px;border-bottom:1px solid var(--line);flex:none;background:#fff}
  .d-nav-btn{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;
    color:var(--primary-d);font-size:18px;font-weight:800;cursor:pointer;line-height:1;flex:none;transition:all .15s ease
  }
  .d-nav-btn:hover{background:var(--primary-soft)}
  .d-nav-btn:active{background:var(--primary-soft);transform:scale(.96)}
  .d-nav-btn:disabled{opacity:.3;cursor:default;background:#fff}
  .d-count{font-size:13px;font-weight:800;color:var(--ink-secondary);min-width:54px;text-align:center}
  .d-close{margin-left:auto;width:34px;height:34px;border-radius:50%;border:none;background:#F1F5F9;color:var(--ink);font-size:15px;cursor:pointer;flex:none;transition:all .15s ease}
  .d-close:hover{background:#E2E8F0}
  .d-close:active{transform:scale(.96)}
  .d-inner{display:flex;flex-direction:column;flex:1;min-height:0}
  @keyframes dInR{from{opacity:.25;transform:translateX(46px)}to{opacity:1;transform:none}}
  @keyframes dInL{from{opacity:.25;transform:translateX(-46px)}to{opacity:1;transform:none}}
  .d-inner.animNext{animation:dInR .24s cubic-bezier(.22,.61,.36,1)}
  .d-inner.animPrev{animation:dInL .24s cubic-bezier(.22,.61,.36,1)}
  .d-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px}
  .d-sec-t{font-size:12px;font-weight:800;color:var(--ink-tertiary);margin:2px 0 8px;letter-spacing:.5px;text-transform:uppercase}
  .d-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .d-row:last-child{border-bottom:none}
  .d-k{color:var(--ink-tertiary);flex:none;width:66px;font-weight:600}
  .d-v{color:var(--ink);flex:1;word-break:break-word;white-space:pre-wrap;line-height:1.55}
  /* 详情：有图时以图为主（大图 + 多图缩略条） */
  .d-hero{
    width:100%;height:34vh;min-height:160px;max-height:300px;background:#F8FAFC;
    border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px;border:1px solid var(--line)
  }
  .d-hero img{max-width:100%;max-height:100%;object-fit:contain;display:block;cursor:zoom-in}
  .d-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
  .d-strip img{width:56px;height:56px;border-radius:var(--radius-sm);object-fit:cover;flex:none;border:2px solid transparent;background:#EDF2F7;cursor:pointer;transition:transform .15s ease}
  .d-strip img.on{border-color:var(--primary)}
  .d-strip img:hover{transform:scale(1.04)}
  .d-foot{flex:none;padding:14px 18px;border-top:1px solid var(--line);background:#fff}
  .d-tags{display:flex;gap:8px}
  .d-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  .d-hint{font-size:11px;color:var(--ink-tertiary)}
  .d-del{border:1px solid #FECACA;background:var(--warn-soft);color:var(--warn);border-radius:var(--radius-sm);padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s ease}
  .d-del:hover{background:#FEE2E2}
  .d-del:active{transform:scale(.97)}
  .d-edit{border:1px solid #BFDBFE;background:var(--primary-soft);color:var(--primary-d);border-radius:var(--radius-sm);padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s ease;flex:none}
  .d-edit:hover{background:#DBEAFE}
  .d-edit:active{transform:scale(.97)}
  .d-actions{display:flex;gap:8px}
  /* 录入页：编辑模式 */
  .cancel-edit{width:100%;margin-top:10px;padding:12px;border:1px solid var(--line);background:#fff;color:var(--ink-secondary);border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;transition:all .15s ease}
  .cancel-edit:hover{background:#F8FAFC}
  .cancel-edit:active{transform:scale(.99)}
  .edit-banner{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border:1px solid #FED7AA;color:#C2410C;border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;font-weight:700;margin-bottom:14px}
  .edit-banner svg{width:16px;height:16px;flex:none}
  @media(max-width:560px){
    .d-k{width:58px}
    .d-photos img{width:78px;height:78px}
  }
  /* 图片放大 */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:80;display:flex;align-items:center;justify-content:center}
  .lightbox img{max-width:94%;max-height:88%;border-radius:var(--radius-sm)}
  .lightbox .lb-close{position:absolute;top:18px;right:22px;width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:22px;cursor:pointer;transition:background .15s ease}
  .lightbox .lb-close:hover{background:rgba(255,255,255,.28)}
  .lightbox .lb-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:14px;background:rgba(255,255,255,.12);padding:10px 16px;border-radius:var(--radius-sm);pointer-events:none}
  [hidden]{display:none!important}
  @media(max-width:560px){
    .summary{grid-template-columns:repeat(2,1fr)}
    .brand{font-size:17px}
    .card{padding:16px}
    .q-item.has-img .q-media{width:42%}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.4" fill="#3B82F6" stroke="none"/><path d="M12 7.5 7 13l3 1-1.5 4 5-3-2.5-1 2-3.5z"/><path d="M5 21l3-5M19 21l-3-5"/></svg>
    宝贝Math小跑计划
  </div>
  <div class="store">数据存本机</div>
</header>

<nav class="tabs">
  <button data-tab="diag" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>诊断
  </button>
  <button data-tab="add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>录入
  </button>
  <button data-tab="book">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h11a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3zM4 5v0M4 5a3 3 0 0 1 3-3h11"/></svg>错题本
  </button>
  <button data-tab="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>记录
  </button>
</nav>

<main class="wrap">
  <!-- 诊断 -->
  <section id="tab-diag">
    <div class="diag-sticky" id="diagSticky">
      <div class="seg" id="seg">
        <button data-p="day" class="active">日</button>
        <button data-p="week">周</button>
        <button data-p="month">月</button>
      </div>
      <div class="period-nav">
        <button id="periodPrev" class="pn-btn" aria-label="上一个">‹</button>
        <span class="pn-label" id="periodLabel"></span>
        <button id="periodNext" class="pn-btn" aria-label="下一个">›</button>
        <button id="periodToday" class="pn-today">回到今/当月</button>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <h3><span class="bar"></span><span id="scopeTitle">今日诊断</span></h3>
      <div class="summary" id="summary"></div>
    </div>
    <div class="card">
      <h3><span class="bar"></span>错题趋势</h3>
      <div id="trend"></div>
    </div>
    <div class="card">
      <h3><span class="bar"></span>错题类型分布</h3>
      <div class="chart-flex">
        <div class="donut-box" id="donutType"></div>
        <div class="legend" id="legendType"></div>
      </div>
    </div>
    <div class="card">
      <h3><span class="bar"></span>知识点分布</h3>
      <div id="barKp"></div>
    </div>
    <div class="card">
      <h3><span class="bar"></span>出错原因分布</h3>
      <div id="barReason"></div>
    </div>
  </section>

  <!-- 录入 -->
  <section id="tab-add" hidden>
    <div class="card">
      <h3><span class="bar"></span><span id="addTitle">录入一道错题</span></h3>
      <div class="edit-banner" id="editBanner" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <span id="editBannerText">正在编辑一道错题</span>
      </div>
      <form id="form" autocomplete="off">
        <label class="fld"><span class="lab">测试时间 <span class="req">*</span></span>
          <input type="date" id="f_date" required></label>
        <label class="fld"><span class="lab">习题类型 <span class="req">*</span></span>
          <div class="radio-row">
            <label><input type="radio" name="ftype" value="专项训练" checked><span>专项训练</span></label>
            <label><input type="radio" name="ftype" value="综合训练"><span>综合训练</span></label>
          </div></label>
        <label class="fld"><span class="lab">错题类型<span class="req">*</span></span>
          <div class="chips" id="chipsType"></div>
          <div class="addrow"><input id="addType" placeholder="手填新类型，如：时间推理"><button type="button" id="btnAddType">添加</button></div></label>
        <label class="fld fld-sub" id="kpField"><span class="lab">知识点<span class="badge">多选</span></span>
          <div class="chips" id="chipsKp"></div>
          <div class="addrow"><input id="addKp" placeholder="手填新知识点，如：找规律"><button type="button" id="btnAddKp">添加</button></div></label>
        <label class="fld"><span class="lab">出错原因<span class="badge">多选</span></span>
          <div class="chips" id="chipsReason"></div>
          <div class="addrow"><input id="addReason" placeholder="手填新原因，如：读题太快"><button type="button" id="btnAddReason">添加</button></div></label>
        <label class="fld"><span class="lab">题目图片<span class="badge">可多张</span></span>
          <div class="up-row">
            <label class="upload-btn">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              拍照
              <input type="file" id="f_camera" accept="image/*" capture="environment" multiple hidden>
            </label>
            <label class="upload-btn">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5L5 20"/></svg>
              相册
              <input type="file" id="f_album" accept="image/*" multiple hidden>
            </label>
          </div>
          <div class="photos" id="photoBox"></div></label>
        <label class="fld"><span class="lab">补充描述</span>
          <textarea id="f_desc" rows="3" maxlength="300" placeholder="选填：记录解题思路、易错点、老师的讲解等"></textarea></label>
        <div class="form-err" id="formErr"></div>
        <button type="submit" class="submit" id="submitBtn">保存这道错题</button>
        <button type="button" class="cancel-edit" id="cancelEdit" hidden>取消编辑</button>
      </form>
    </div>
  </section>

  <!-- 错题本 -->
  <section id="tab-book" hidden>
    <div class="card">
      <h3><span class="bar"></span>错题本</h3>
      <div class="book-filter" id="bookFilter">
        <div class="chips" id="bookFilterChips"><span class="chip on" data-v="">全部</span></div>
      </div>
      <div id="bookList"></div>
    </div>
  </section>

  <!-- 记录 + 数据 -->
  <section id="tab-list" hidden>
    <div class="list-head">
      <button class="tool-btn" id="exportBtn">导出备份</button>
      <button class="tool-btn" id="importBtn">导入备份</button>
      <button class="tool-btn warn" id="clearBtn">清空全部</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <div id="recordList"></div>
    <div class="ver"><span id="verLine"></span> · <button type="button" class="ver-refresh" id="verRefresh">检查更新</button></div>
  </section>
</main>

<!-- 错题详情卡片 -->
<div class="detail" id="detail" hidden>
  <div class="detail-mask" id="detailMask"></div>
  <div class="detail-card" id="detailCard">
    <div class="d-head">
      <button class="d-nav-btn" id="detailPrev" aria-label="上一道">‹</button>
      <span class="d-count" id="detailCount"></span>
      <button class="d-nav-btn" id="detailNext" aria-label="下一道">›</button>
      <button class="d-close" id="detailClose" aria-label="关闭">✕</button>
    </div>
    <div class="d-inner" id="detailInner">
      <div class="d-body" id="detailBody"></div>
      <div class="d-foot">
        <div class="d-tags" id="detailTags"></div>
        <div class="d-bottom">
          <span class="d-hint">左右滑动切换</span>
          <div class="d-actions">
            <button class="d-edit" id="detailEdit">编辑</button>
            <button class="d-del" id="detailDel">删除</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose">×</button>
  <img id="lbImg" alt="题目大图">
  <div class="lb-msg" id="lbMsg" hidden>加载中…</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var LS_KEY = 'mathsprint_records_v2';
  var HIER_KEY = 'mathsprint_hier_v1';
  var SEED_FLAG = 'mathsprint_seeded_v2';
  var MIG_HIER = 'mathsprint_mig_hier_v1';   /* 图形比大小：数感 → 图形空间 */
  var MIG_REASON = 'mathsprint_mig_reason_v1';/* 题目看不懂 → 题目没看懂 */
  var PALETTE = ['#3B82F6','#FB923C','#22C55E','#EF4444','#8B5CF6','#14B8A6','#F59E0B','#38BDF8','#F472B6','#818CF8'];
  var DEFAULT_HIER = {
    '数感':['计算','巧算'],
    '逻辑推理':['枚举','找规律','等量代换'],
    '图形空间':['三视图','图形认知','对称','图形比大小'],
    '综合应用题':['统计图','加减法应用','乘除应用']
  };
  var PRESET = { reasons:['没看题目','题目没看懂','计算粗心','基础概念不清晰','方法不熟练'] };
  var TAGS = ['待复习','已复习','已攻克'];
  var state = { records:[], period:'day', cursor:new Date(), hier:{}, sel:{type:'', kps:[], reasons:[], photos:[]}, bookFilter:'', bookList:[], detailId:null, editId:null };

  /* ---------- 工具 ---------- */
  function pad(n){return n<10?'0'+n:''+n;}
  function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
  function num(v){var n=parseFloat(v);return isNaN(n)?0:n;}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function loadLocal(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'[]');}catch(e){return [];}}
  function saveLocal(a){try{localStorage.setItem(LS_KEY,JSON.stringify(a));}catch(e){ toast('保存空间不足，请导出备份并清理'); }}

  /* 层级 错题类型→知识点 持久化 */
  function loadHier(){
    var h=null;
    try{ var s=JSON.parse(localStorage.getItem(HIER_KEY)); if(s&&typeof s==='object') h=s; }catch(e){}
    if(!h) h=JSON.parse(JSON.stringify(DEFAULT_HIER));
    /* 一次性迁移：把「图形比大小」从「数感」移到「图形空间」 */
    try{
      if(!localStorage.getItem(MIG_HIER)){
        var changed=false;
        if(h['数感'] && h['数感'].indexOf('图形比大小')>=0){
          h['数感'].splice(h['数感'].indexOf('图形比大小'),1); changed=true;
        }
        if(h['图形空间'] && h['图形空间'].indexOf('图形比大小')<0){
          h['图形空间'].push('图形比大小'); changed=true;
        }
        if(changed) localStorage.setItem(HIER_KEY, JSON.stringify(h));
        localStorage.setItem(MIG_HIER,'1');
      }
    }catch(e){}
    return h;
  }
  function saveHier(){ try{ localStorage.setItem(HIER_KEY, JSON.stringify(state.hier)); }catch(e){} }
  /* 一次性迁移：历史记录里的「题目看不懂」改为「题目没看懂」 */
  function migrateRecords(){
    try{
      if(localStorage.getItem(MIG_REASON)) return;
      var arr=loadLocal(), changed=false;
      arr.forEach(function(r){
        if(r.出错原因 && r.出错原因.indexOf('题目看不懂')>=0){
          r.出错原因=r.出错原因.split('、')
            .map(function(s){return s.trim()==='题目看不懂'?'题目没看懂':s.trim();})
            .filter(Boolean).join('、');
          changed=true;
        }
      });
      if(changed) saveLocal(arr);
      localStorage.setItem(MIG_REASON,'1');
    }catch(e){}
  }

  /* 表单本地缓存 */
  var FORM_KEY='mathsprint_form_v2', _fcTimer=null;
  function doSaveForm(){
    try{
      localStorage.setItem(FORM_KEY, JSON.stringify({
        date:document.getElementById('f_date').value,
        type:(document.querySelector('input[name=ftype]:checked')||{}).value||'',
        typeSel:state.sel.type, kps:state.sel.kps, reasons:state.sel.reasons,
        desc:document.getElementById('f_desc').value
      }));
    }catch(e){}
  }
  function saveFormCache(){ if(_fcTimer) clearTimeout(_fcTimer); _fcTimer=setTimeout(doSaveForm,300); }
  function clearFormCache(){ try{ localStorage.removeItem(FORM_KEY); }catch(e){} }
  function restoreFormCache(){
    try{
      var s=JSON.parse(localStorage.getItem(FORM_KEY)||'null'); if(!s) return;
      if(s.date) document.getElementById('f_date').value=s.date;
      if(s.type){ var rb=document.querySelector('input[name=ftype][value="'+s.type+'"]'); if(rb) rb.checked=true; }
      if(s.typeSel) state.sel.type=s.typeSel;
      if(s.kps) state.sel.kps=s.kps;
      if(s.reasons) state.sel.reasons=s.reasons;
      if(s.desc) document.getElementById('f_desc').value=s.desc;
    }catch(e){}
  }

  /* ---------- 首次示例数据 ---------- */
  function seedIfEmpty(){
    if(localStorage.getItem(SEED_FLAG)) return;
    var seed=[
      {_id:'seed1',测试时间:'2026-09-03',习题类型:'专项训练',错题类型:'数感',知识点:'计算、巧算',出错原因:'计算粗心、方法不熟练',tag:'已攻克',photos:[]},
      {_id:'seed2',测试时间:'2026-09-06',习题类型:'综合训练',错题类型:'图形空间',知识点:'三视图',出错原因:'题目没看懂',tag:'已复习',photos:[]},
      {_id:'seed3',测试时间:'2026-09-09',习题类型:'专项训练',错题类型:'逻辑推理',知识点:'枚举',出错原因:'没看题目',tag:'待复习',photos:[]},
      {_id:'seed4',测试时间:'2026-09-10',习题类型:'综合训练',错题类型:'图形空间',知识点:'图形比大小',出错原因:'计算粗心',tag:'待复习',photos:[]},
      {_id:'seed5',测试时间:'2026-09-11',习题类型:'专项训练',错题类型:'逻辑推理',知识点:'等量代换',出错原因:'基础概念不清晰',tag:'待复习',photos:[]}
    ];
    saveLocal(seed); localStorage.setItem(SEED_FLAG,'1');
  }

  /* ---------- 数据层（纯本地） ---------- */
  function loadAll(){ try{ seedIfEmpty(); }catch(e){} state.hier=loadHier(); try{ migrateRecords(); }catch(e){} return loadLocal(); }
  function addRecord(flat){
    var rec = Object.assign({_id:'rec_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), tag:'待复习', photos:[]}, flat);
    var arr = loadLocal(); arr.push(rec); saveLocal(arr);
    return refreshAll();
  }
  function updateRecord(id, patch){
    var arr = loadLocal();
    arr.forEach(function(r){ if(r._id===id) Object.assign(r, patch); });
    saveLocal(arr); return refreshAll();
  }
  function removeRecord(id){
    var a = loadLocal().filter(function(r){return r._id!==id;}); saveLocal(a);
    return refreshAll();
  }

  /* ---------- 备份 导出/导入（含照片） ---------- */
  function exportData(){
    var data = loadLocal().map(function(r){
      var c = JSON.parse(JSON.stringify(r));
      return c;
    });
    var blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'Math小跑备份_' + ymd(new Date()) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast('已导出 ' + data.length + ' 条备份');
  }
  function importData(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var incoming = JSON.parse(reader.result);
        if(!Array.isArray(incoming)) throw new Error('格式不对');
        var map = {};
        loadLocal().forEach(function(r){ map[r._id] = r; });
        var added = 0;
        incoming.forEach(function(r){
          if(!r || !r.测试时间) return;
          if(!r._id) r._id = 'rec_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
          if(!Array.isArray(r.photos)) r.photos=[];
          if(!r.tag) r.tag='待复习';
          map[r._id] = r; added++;
        });
        saveLocal(Object.keys(map).map(function(k){return map[k];}));
        localStorage.setItem(SEED_FLAG,'1');
        refreshAll();
        toast('已导入 ' + added + ' 条记录');
      }catch(e){ toast('导入失败：文件格式不正确'); }
    };
    reader.readAsText(file);
  }
  function clearAll(){
    var n = state.records.length;
    if(!n){ toast('没有可清空的记录'); return; }
    if(!confirm('确定清空全部 ' + n + ' 条数据？此操作不可恢复。')) return;
    saveLocal([]); localStorage.removeItem(SEED_FLAG); refreshAll(); toast('已清空');
  }

  /* ---------- 周期范围 ---------- */
  function periodScope(p, cursor){
    cursor = cursor || new Date();
    if(p==='day') return {start:ymd(cursor), end:ymd(cursor), tStart:addDays(cursor,-6), tEnd:cursor, title:'当日诊断', label:ymd(cursor).replace(/-/g,'/')};
    if(p==='week'){
      var dow=(cursor.getDay()+6)%7, mon=addDays(cursor,-dow), sun=addDays(mon,6);
      return {start:ymd(mon), end:ymd(sun), tStart:mon, tEnd:sun, title:'本周诊断', label:ymd(mon).slice(5).replace('-','/')+' ~ '+ymd(sun).slice(5).replace('-','/')};
    }
    var first=new Date(cursor.getFullYear(),cursor.getMonth(),1), last=new Date(cursor.getFullYear(),cursor.getMonth()+1,0);
    return {start:ymd(first), end:ymd(last), tStart:first, tEnd:last, title:'本月诊断', label:cursor.getFullYear()+'年'+(cursor.getMonth()+1)+'月'};
  }

  /* ---------- 统计 ---------- */
  function inScope(r, sc){var d=r.测试时间;return d>=sc.start && d<=sc.end;}
  function tally(field, recs){
    var m={};
    recs.forEach(function(r){
      (r[field]||'').split('、').forEach(function(t){t=t.trim(); if(t) m[t]=(m[t]||0)+1;});
    });
    return m;
  }
  function toSegs(m){
    var arr=Object.keys(m).map(function(k){return {label:k,value:m[k]};});
    arr.sort(function(a,b){return b.value-a.value;});
    arr.forEach(function(s,i){s.color=PALETTE[i%PALETTE.length];});
    return arr;
  }

  /* ---------- 图表 ---------- */
  function donut(segs, centerLabel, centerVal){
    var size=180,r=66,w=22,cx=size/2,cy=size/2,C=2*Math.PI*r;
    var total=segs.reduce(function(a,s){return a+s.value;},0);
    if(total===0) return '<svg class="chart" viewBox="0 0 '+size+' '+size+'" style="max-width:200px;margin:0 auto">'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#E2E8F0" stroke-width="'+w+'"/>'+
      '<text x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="central" fill="#94A3B8" font-size="13">暂无数据</text></svg>';
    var off=0,parts='';
    segs.forEach(function(s){
      var len=s.value/total*C;
      parts+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="'+w+'" '+
        'stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+
        '" transform="rotate(-90 '+cx+' '+cy+')"/>';
      off+=len;
    });
    return '<svg class="chart" viewBox="0 0 '+size+' '+size+'" style="max-width:200px;margin:0 auto">'+
      parts+'<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" fill="#0F172A" font-size="22" font-weight="800">'+centerVal+'</text>'+
      '<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" fill="#64748B" font-size="11">'+centerLabel+'</text></svg>';
  }
  function legendHTML(segs){
    if(!segs.length) return '<span style="color:#94A3B8">暂无数据</span>';
    return segs.map(function(s){return '<span><i style="background:'+s.color+'"></i>'+s.label+' · '+s.value+'</span>';}).join('');
  }
  var _mc=null;
  function textW(str,px){
    if(!_mc){ try{ _mc=document.createElement('canvas').getContext('2d'); }catch(e){ _mc=null; } }
    if(!_mc) return str.length*(px||13);
    _mc.font=(px||13)+'px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';
    return _mc.measureText(str).width;
  }
  function hbar(segs){
    if(!segs.length) return '<div style="color:#94A3B8;font-size:13px">暂无数据</div>';
    var total=segs.reduce(function(a,s){return a+s.value;},0)||1;
    var W=320, fs=13, rowH=14, gap=15, valW=20, gapL=10;
    var maxLabelW=0;
    segs.forEach(function(s){ maxLabelW=Math.max(maxLabelW, textW(s.label,fs)); });
    var lw=Math.min(Math.ceil(maxLabelW), Math.round(W*0.44));
    var x0=lw+gapL, track=Math.max(50, W-x0-valW);
    var h=segs.length*(rowH+gap)-gap, bars='';
    segs.forEach(function(s,i){
      var y=i*(rowH+gap), cy=y+rowH/2;
      var bw=Math.max(6,Math.round(s.value/total*track));
      var squeeze=(textW(s.label,fs)>lw)?' textLength="'+lw+'" lengthAdjust="spacingAndGlyphs"':'';
      bars+='<text x="0" y="'+(cy+4.5)+'" font-size="'+fs+'" fill="#0F172A"'+squeeze+'>'+s.label+'</text>';
      bars+='<rect x="'+x0+'" y="'+y+'" width="'+track+'" height="'+rowH+'" rx="'+(rowH/2)+'" fill="#E2E8F0"/>';
      bars+='<rect x="'+x0+'" y="'+y+'" width="'+bw+'" height="'+rowH+'" rx="'+(rowH/2)+'" fill="'+s.color+'"/>';
      bars+='<text x="'+W+'" y="'+(cy+4.5)+'" text-anchor="end" font-size="'+fs+'" font-weight="700" fill="#64748B">'+s.value+'</text>';
    });
    return '<svg class="chart" viewBox="0 0 '+W+' '+h+'" style="max-width:420px">'+bars+'</svg>';
  }
  function vbar(items){
    if(!items.length) return '<div style="color:#94A3B8;font-size:13px">暂无数据</div>';
    var max=Math.max.apply(null,items.map(function(it){return it.v;}).concat([1]));
    var n=items.length, bw=26, gap=Math.min(16,(320/n)), baseH=150, x0=8, totalW=n*(bw+gap);
    var svgH=baseH+28, bars='';
    items.forEach(function(it,i){
      var x=x0+i*(bw+gap), bh=Math.round(it.v/max*(baseH-20));
      var y=baseH-bh;
      bars+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="6" fill="#3B82F6"/>';
      if(it.v>0) bars+='<text x="'+(x+bw/2)+'" y="'+(y-4)+'" text-anchor="middle" font-size="11" fill="#64748B">'+it.v+'</text>';
      bars+='<text x="'+(x+bw/2)+'" y="'+(baseH+16)+'" text-anchor="middle" font-size="10" fill="#94A3B8">'+it.label+'</text>';
    });
    return '<svg class="chart" viewBox="0 0 '+totalW+' '+svgH+'" style="max-width:560px">'+bars+'</svg>';
  }

  /* ---------- 渲染 ---------- */
  function stat(v,l,cls){return '<div class="stat"><div class="v '+(cls||'')+'">'+v+'</div><div class="l">'+l+'</div></div>';}
  function renderDiagnostics(){
    var sc = periodScope(state.period, state.cursor);
    document.getElementById('scopeTitle').textContent = sc.label+' 诊断';
    document.getElementById('periodLabel').textContent = sc.label;
    document.getElementById('periodToday').textContent = '回到'+(state.period==='day'?'今天':state.period==='week'?'本周':'本月');
    var recs = state.records.filter(function(r){return inScope(r,sc);});
    var n=recs.length;
    var c0=recs.filter(function(r){return r.tag==='待复习';}).length;
    var c1=recs.filter(function(r){return r.tag==='已复习';}).length;
    var c2=recs.filter(function(r){return r.tag==='已攻克';}).length;
    var s = document.getElementById('summary');
    s.innerHTML =
      stat(n,'错题数','')+
      stat(c0,'待复习','t0')+
      stat(c1,'已复习','t1')+
      stat(c2,'已攻克','t2');
    var items=[], cur=sc.tStart;
    while(cur<=sc.tEnd){
      var ds=ymd(cur), w=0;
      state.records.forEach(function(r){ if(r.测试时间===ds) w+=1; });
      items.push({label:ds.slice(5).replace('-','/'), v:w});
      cur=addDays(cur,1);
    }
    document.getElementById('trend').innerHTML = vbar(items);
    var segT=toSegs(tally('错题类型',recs));
    document.getElementById('donutType').innerHTML = donut(segT,'错题数', n);
    document.getElementById('legendType').innerHTML = legendHTML(segT);
    document.getElementById('barKp').innerHTML = hbar(toSegs(tally('知识点',recs)));
    document.getElementById('barReason').innerHTML = hbar(toSegs(tally('出错原因',recs)));
  }

  function renderBook(){
    var box=document.getElementById('bookList');
    if(!state.records.length){ state.bookList=[]; box.innerHTML='<div class="empty">还没有错题，去「录入」记一笔吧～</div>'; return; }
    var byTime=function(a,b){ return a.测试时间<b.测试时间?1:(a.测试时间>b.测试时间?-1:0); };
    var filter=state.bookFilter, lead, list;
    if(!filter){
      list=state.records.slice().sort(byTime);
      lead='<div class="book-summary">全部错题 · 共 '+list.length+' 道 · 按时间倒序</div>';
    } else {
      list=state.records.filter(function(r){
        var kps=(r.知识点||'未分类').split('、').filter(Boolean);
        return kps.indexOf(filter)>=0;
      }).slice().sort(byTime);
      if(!list.length){ state.bookList=[]; box.innerHTML='<div class="empty">「'+filter+'」暂无错题</div>'; return; }
      lead='<div class="book-summary">'+esc(filter)+' · 共 '+list.length+' 道</div>';

    box.innerHTML = lead + '<div class="q-list">'+list.map(qItem).join('')+'</div>';
    Array.prototype.forEach.call(box.querySelectorAll('.q-item'),function(it){
      it.addEventListener('click',function(){ openDetail(it.getAttribute('data-id')); });
    });

  /* 错题本知识点筛选：全部铺开的 chips */
  function renderBookFilterChips(){
    var box=document.getElementById('bookFilterChips');
    var set={};
    state.records.forEach(function(r){
      (r.知识点||'未分类').split('、').filter(Boolean).forEach(function(k){ set[k]=true; });
    });
    var keys=Object.keys(set).sort();
    if(state.bookFilter && keys.indexOf(state.bookFilter)<0) state.bookFilter='';
    var chips=['<span class="chip'+(!state.bookFilter?' on':'')+'" data-v="">全部</span>'];
    keys.forEach(function(k){
      chips.push('<span class="chip'+(state.bookFilter===k?' on':'')+'" data-v="'+k+'">'+k+'</span>');
    });
    box.innerHTML=chips.join('');
    Array.prototype.forEach.call(box.querySelectorAll('.chip'),function(c){
      c.addEventListener('click',function(){
        state.bookFilter=c.getAttribute('data-v')||'';
        Array.prototype.forEach.call(box.querySelectorAll('.chip'),function(x){x.classList.remove('on');});
        c.classList.add('on');
        renderBook();
      });

  /* 列表项（点击查看详情）：知识点/原因分两行显示 */
  function qItem(r){
    var ti=TAGS.indexOf(r.tag); if(ti<0) ti=0;

  /* ---------- 错题详情卡片（弹层 + 左右滑动） ---------- */

  function navDetail(dir){
    var list=state.bookList||[], i=currentIndex();

  function bindDetail(){
    document.getElementById('detailClose').addEventListener('click',closeDetail);
    document.getElementById('detailMask').addEventListener('click',closeDetail);
    document.getElementById('detailPrev').addEventListener('click',function(){ navDetail(-1); });
    document.getElementById('detailNext').addEventListener('click',function(){ navDetail(1); });
    document.getElementById('detailEdit').addEventListener('click',function(){ startEdit(state.detailId); });
    document.getElementById('detailDel').addEventListener('click',function(){
      if(!confirm('确定删除这道错题？')) return;
      var i=currentIndex(), id=state.detailId;
      removeRecord(id).then(function(){
        if(!state.bookList||!state.bookList.length){ closeDetail(); toast('已删除'); return; }
        var ni=Math.min(i,state.bookList.length-1);
        state.detailId=state.bookList[ni]._id; renderDetail(0); toast('已删除');
      });
    });
    document.addEventListener('keydown',function(e){
      if(document.getElementById('detail').hidden) return;
      if(e.key==='ArrowLeft') navDetail(-1);
      else if(e.key==='ArrowRight') navDetail(1);
      else if(e.key==='Escape') closeDetail();
    });
    /* 左右滑动切换 */
    var card=document.getElementById('detailCard');
    var x0=0,y0=0,drag=false,dx=0;
    card.addEventListener('touchstart',function(e){
      if(e.touches.length!==1) return;
      x0=e.touches[0].clientX; y0=e.touches[0].clientY; drag=false; dx=0;
    },{passive:true});
    card.addEventListener('touchmove',function(e){
      if(e.touches.length!==1) return;
      var mx=e.touches[0].clientX-x0, my=e.touches[0].clientY-y0;
      if(!drag){ if(Math.abs(mx)>10 && Math.abs(mx)>Math.abs(my)) drag=true; else return; }
      dx=mx; e.preventDefault();
      var inner=document.getElementById('detailInner');
      inner.style.transition='none';
      inner.style.transform='translateX('+(dx*0.5)+'px)';
      inner.style.opacity=String(Math.max(.55,1-Math.abs(dx)/460));
    },{passive:false});
    card.addEventListener('touchend',function(){
      var inner=document.getElementById('detailInner');
      inner.style.transition=''; inner.style.transform=''; inner.style.opacity='';
      if(!drag) return; drag=false;
      if(dx<=-55) navDetail(1); else if(dx>=55) navDetail(-1);
    });
  }
  function openLight(src){

    state.sel = {type:'', kps:[], reasons:[], photos:[]};
    document.getElementById('f_date').value = ymd(new Date());
    var rb = document.querySelector('input[name=ftype][value="专项训练"]'); if(rb) rb.checked = true;
    document.getElementById('f_desc').value = '';
    document.getElementById('addTitle').textContent = '录入一道错题';
    document.getElementById('editBanner').hidden = true;
    document.getElementById('submitBtn').textContent = '保存这道错题';
    document.getElementById('cancelEdit').hidden = true;
    clearFormCache();
    renderTypeChips(); renderKpChips(); renderReasonChips(); renderPhotos();
  }

  /* ---------- chips：错题类型(父,单选) ---------- */
  function renderTypeChips(){
    var box=document.getElementById('chipsType');
    var keys=Object.keys(state.hier);
    var html='';
    keys.forEach(function(k){
      var on=state.sel.type===k;
      html+='<span class="chip'+(on?' on':'')+'" data-v="'+k+'">'+k+'</span>';
    });
    if(state.sel.type && keys.indexOf(state.sel.type)<0){
      html+='<span class="chip custom on" data-v="'+state.sel.type+'">'+state.sel.type+'<span class="x">×</span></span>';
    }
    box.innerHTML=html;
    Array.prototype.forEach.call(box.querySelectorAll('.chip'),function(c){
      c.addEventListener('click',function(){
        var v=c.getAttribute('data-v');
        if(c.querySelector('.x')){ // 删除自定义类型
          delete state.hier[v]; saveHier(); state.sel.type=''; state.sel.kps=[];
          renderTypeChips(); renderKpChips(); saveFormCache(); return;
        }
        state.sel.type = (state.sel.type===v)?'':v;
        state.sel.kps=[];
        renderTypeChips(); renderKpChips(); saveFormCache();
      });
    });
  }
  var LOCK_SVG='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>';
  function renderKpChips(){
    var box=document.getElementById('chipsKp');
    var field=document.getElementById('kpField');
    if(!state.sel.type){
      if(field) field.classList.add('locked');
      box.innerHTML='<span class="kp-locked" id="kpLocked" role="button" tabindex="0" aria-label="先选择上方错题类型">'+LOCK_SVG+'</span>';
      var lk=document.getElementById('kpLocked');
      if(lk) lk.addEventListener('click',function(){ toast('请先选上面的错题类型'); });
      return;
    }
    if(field) field.classList.remove('locked');
    var arr=state.hier[state.sel.type]||[];
    var html='';
    arr.forEach(function(p){
      var on=state.sel.kps.indexOf(p)>=0;
      html+='<span class="chip'+(on?' on':'')+'" data-v="'+p+'">'+p+'</span>';
    });
    state.sel.kps.forEach(function(v){
      if(arr.indexOf(v)<0) html+='<span class="chip custom on" data-v="'+v+'">'+v+'<span class="x">×</span></span>';
    });
    box.innerHTML=html;
    Array.prototype.forEach.call(box.querySelectorAll('.chip'),function(c){
      c.addEventListener('click',function(){
        var v=c.getAttribute('data-v');
        if(c.querySelector('.x')){
          var a=state.hier[state.sel.type]||[]; var i=a.indexOf(v); if(i>=0) a.splice(i,1); saveHier();
          var j=state.sel.kps.indexOf(v); if(j>=0) state.sel.kps.splice(j,1);
          renderKpChips(); saveFormCache(); return;
        }
        var idx=state.sel.kps.indexOf(v);
        if(idx>=0) state.sel.kps.splice(idx,1); else state.sel.kps.push(v);
        renderKpChips(); saveFormCache();
      });
    });
  }
  function renderReasonChips(){
    var box=document.getElementById('chipsReason');
    var arr=state.sel.reasons, html='';
    PRESET.reasons.forEach(function(p){
      var on=arr.indexOf(p)>=0;
      html+='<span class="chip'+(on?' on':'')+'" data-v="'+p+'">'+p+'</span>';
    });
    arr.forEach(function(v){
      if(PRESET.reasons.indexOf(v)>=0) return;
      html+='<span class="chip custom on" data-v="'+v+'">'+v+'<span class="x">×</span></span>';
    });
    box.innerHTML=html;
    Array.prototype.forEach.call(box.querySelectorAll('.chip'),function(c){
      c.addEventListener('click',function(){
        var v=c.getAttribute('data-v');
        if(c.querySelector('.x')){ var i=arr.indexOf(v); if(i>=0) arr.splice(i,1); renderReasonChips(); saveFormCache(); return; }
        var idx=arr.indexOf(v); if(idx>=0) arr.splice(idx,1); else arr.push(v);
        renderReasonChips(); saveFormCache();
      });
    });
  }
  function bindAdd(kind, inputId, btnId){
    function add(){
      var v=document.getElementById(inputId).value.trim();
      if(!v) return;
      if(kind==='type'){
        if(!state.hier[v]) state.hier[v]=[];
        saveHier(); state.sel.type=v; state.sel.kps=[];
      } else if(kind==='kp'){
        if(!state.sel.type){ toast('请先选错题类型'); return; }
        if((state.hier[state.sel.type]||[]).indexOf(v)<0) state.hier[state.sel.type].push(v);
        saveHier();
        if(state.sel.kps.indexOf(v)<0) state.sel.kps.push(v);
      } else {
        if(state.sel.reasons.indexOf(v)<0) state.sel.reasons.push(v);
      }
      document.getElementById(inputId).value='';
      renderTypeChips(); renderKpChips(); renderReasonChips(); saveFormCache();
    }
    document.getElementById(btnId).addEventListener('click',add);
    document.getElementById(inputId).addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();add();} });
  }

  /* ---------- 照片：压缩后内联 ---------- */
  function compressFile(file){
    return new Promise(function(res){
      var reader=new FileReader();
      reader.onload=function(){
        var img=new Image();
        img.onload=function(){
          var max=900, w=img.width, h=img.height;
          if(w>h && w>max){ h=Math.round(h*max/w); w=max; }
          else if(h>max){ w=Math.round(w*max/h); h=max; }
          var c=document.createElement('canvas'); c.width=w; c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          res({id:'ph_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), name:file.name, data:c.toDataURL('image/jpeg',0.7)});
        };
        img.onerror=function(){ res({id:'ph_'+Date.now(), name:file.name, data:reader.result}); };
        img.src=reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  function renderPhotos(){
    var box=document.getElementById('photoBox');
    box.innerHTML=state.sel.photos.map(function(p,i){
      return '<div class="photo-thumb"><img src="'+p.data+'" alt=""><button class="rm" data-i="'+i+'">×</button></div>';
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('img'),function(img){
      img.addEventListener('click',function(){ openLight(img.getAttribute('src')); });
    });
    Array.prototype.forEach.call(box.querySelectorAll('.rm'),function(b){
      b.addEventListener('click',function(){
        state.sel.photos.splice(parseInt(b.getAttribute('data-i'),10),1);
        renderPhotos();
      });
    });
  }

  function toast(msg){
    var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); },1800);
  }

  /* ---------- 刷新 ---------- */
  function refreshAll(){
    try { state.records = loadAll(); } catch(e){ state.records = state.records || []; }
    renderDiagnostics(); renderList();
    if(!document.getElementById('tab-book').hidden){ renderBookFilterChips(); renderBook(); }
    return Promise.resolve();
  }

  /* ---------- 事件 ---------- */
  function bindTabs(){
    Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'),function(b){
      b.addEventListener('click',function(){
        var tab=b.getAttribute('data-tab');
        Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'),function(x){x.classList.remove('active');});
        b.classList.add('active');
        ['diag','add','book','list'].forEach(function(k){ document.getElementById('tab-'+k).hidden = (k!==tab); });
        if(tab==='diag') renderDiagnostics();
        if(tab==='book'){ renderBookFilterChips(); renderBook(); }
        window.scrollTo(0,0);
        updateSticky();
      });
    });
  }
  function bindSeg(){
    Array.prototype.forEach.call(document.querySelectorAll('#seg button'),function(b){
      b.addEventListener('click',function(){
        Array.prototype.forEach.call(document.querySelectorAll('#seg button'),function(x){x.classList.remove('active');});
        b.classList.add('active');
        state.period=b.getAttribute('data-p');
        state.cursor=new Date();
        renderDiagnostics();
      });
    });
  }
  function shiftCursor(unit, delta){
    var c=new Date(state.cursor);
    if(unit==='day') c.setDate(c.getDate()+delta);
    else if(unit==='week') c.setDate(c.getDate()+delta*7);
    else c.setMonth(c.getMonth()+delta);
    state.cursor=c;
  }
  function bindPeriodNav(){
    document.getElementById('periodPrev').addEventListener('click',function(){ shiftCursor(state.period,-1); renderDiagnostics(); });
    document.getElementById('periodNext').addEventListener('click',function(){ shiftCursor(state.period,1); renderDiagnostics(); });
    document.getElementById('periodToday').addEventListener('click',function(){ state.cursor=new Date(); renderDiagnostics(); });
  }
  /* 吸顶：滚动时给吸顶条加阴影（诊断页时间栏 + 错题本筛选栏） */
  var _stickyEls=[];
  function updateSticky(){
    _stickyEls.forEach(function(el){
      if(el.getBoundingClientRect().top<=0) el.classList.add('stuck');
      else el.classList.remove('stuck');
    });
  }
  function bindSticky(){
    _stickyEls=[document.getElementById('diagSticky'), document.getElementById('bookFilter')].filter(Boolean);
    window.addEventListener('scroll', updateSticky, {passive:true});
    updateSticky();
  }
  function bindForm(){
    state.hier = loadHier();
    document.getElementById('f_date').value = ymd(new Date());
    restoreFormCache();
    renderTypeChips(); renderKpChips(); renderReasonChips();
    bindAdd('type','addType','btnAddType');
    bindAdd('kp','addKp','btnAddKp');
    bindAdd('reason','addReason','btnAddReason');
    function onPhotos(e){
      var files=e.target.files; if(!files||!files.length) return;
      Array.prototype.forEach.call(files,function(f){
        compressFile(f).then(function(p){ state.sel.photos.push(p); renderPhotos(); });
      });
      e.target.value='';
    }
    document.getElementById('f_camera').addEventListener('change',onPhotos);
    document.getElementById('f_album').addEventListener('change',onPhotos);
    document.getElementById('f_date').addEventListener('change', saveFormCache);
    document.getElementById('f_desc').addEventListener('input', saveFormCache);
    Array.prototype.forEach.call(document.querySelectorAll('input[name=ftype]'),function(rb){ rb.addEventListener('change', saveFormCache); });
    document.getElementById('form').addEventListener('submit',function(e){
      e.preventDefault();
      var err=document.getElementById('formErr');
      var date=document.getElementById('f_date').value;
      var type=document.querySelector('input[name=ftype]:checked').value;
      var desc=document.getElementById('f_desc').value.trim();
      if(!date){err.textContent='请选择测试时间';return;}
      if(!state.sel.type){err.textContent='请选择错题类型';return;}
      var btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='保存中…';
      var photos=state.sel.photos.map(function(p){return {id:p.id,name:p.name,data:p.data};});
      var flat={ 测试时间:date, 习题类型:type, 错题类型:state.sel.type,
        知识点:state.sel.kps.join('、'), 出错原因:state.sel.reasons.join('、'),
        补充描述:desc, photos:photos };
      var isEdit=!!state.editId;
      var done = isEdit ? updateRecord(state.editId, flat) : addRecord(flat);
      done.then(function(){
        btn.disabled=false;
        clearFormCache();
        state.sel={type:'',kps:[],reasons:[],photos:[]};
        document.getElementById('f_desc').value='';
        state.editId=null;
        document.getElementById('addTitle').textContent='录入一道错题';
        document.getElementById('editBanner').hidden=true;
        document.getElementById('submitBtn').textContent='保存这道错题';
        document.getElementById('cancelEdit').hidden=true;
        renderTypeChips(); renderKpChips(); renderReasonChips(); renderPhotos();
        toast(isEdit?'已保存修改 ✓':'已保存到本机 ✓');
        document.querySelector('nav.tabs button[data-tab="'+(isEdit?'book':'diag')+'"]').click();
      });
    });
    document.getElementById('cancelEdit').addEventListener('click',cancelEdit);
  }
  function bindData(){
    document.getElementById('exportBtn').addEventListener('click', exportData);
    document.getElementById('clearBtn').addEventListener('click', clearAll);
    var fileInput=document.getElementById('importFile');
    document.getElementById('importBtn').addEventListener('click',function(){ fileInput.click(); });
    fileInput.addEventListener('change',function(e){
      var f=e.target.files && e.target.files[0];
      if(f) importData(f);
      e.target.value='';
    });
    document.getElementById('lbClose').addEventListener('click',function(){
      document.getElementById('lightbox').hidden=true;
      document.getElementById('lbImg').src='';
    });
    document.getElementById('lightbox').addEventListener('click',function(e){ if(e.target.id==='lightbox'){ this.hidden=true; document.getElementById('lbImg').src=''; } });
  }

  /* ---------- Service Worker 注册（离线/可安装） ---------- */
  var SW_VER = 'v21';
  function registerSW(){
    if(!('serviceWorker' in navigator)) return;
    if(location.protocol!=='https:' && location.hostname!=='localhost' && location.hostname!=='127.0.0.1') return;
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('./sw.js?v=' + SW_VER)
        .then(function(reg){ reg.update(); })
        .catch(function(){});
    });
    navigator.serviceWorker.addEventListener('controllerchange',function(){ window.location.reload(); });
  }
  /* 手动检查更新：清缓存 + 注销 SW 后重新加载，确保拿到最新版本 */
  function forceUpdate(){
    var btn=document.getElementById('verRefresh');
    if(btn){ btn.disabled=true; btn.textContent='更新中…'; }
    var p=Promise.resolve();
    if('caches' in window){
      p=p.then(function(){ return caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }); });
    }
    if('serviceWorker' in navigator){
      p=p.then(function(){ return navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); }); });
    }
    p.then(function(){ location.reload(); }, function(){ location.reload(); });
  }

document.addEventListener('DOMContentLoaded',function(){
  bindTabs(); bindSeg(); bindPeriodNav(); bindSticky(); bindForm(); bindData(); bindDetail();
  var vl=document.getElementById('verLine'); if(vl) vl.textContent='版本 '+SW_VER;
  var vr=document.getElementById('verRefresh'); if(vr) vr.addEventListener('click',forceUpdate);
  registerSW();
  refreshAll();
});
})();
</script>
