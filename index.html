<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4D96FF">
<title>宝贝Math小跑计划</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  :root{
    --bg:#F4F7FB; --card:#FFFFFF; --ink:#23303F; --sub:#7C8AA0;
    --primary:#4D96FF; --primary-d:#2F7BE8; --accent:#FF9F45; --line:#E8EEF6;
    --ok:#37C997; --warn:#FF6B6B; --soft:#EEF4FF;
    --t0:#FF9F45; --t1:#4D96FF; --t2:#37C997;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.5;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:760px;margin:0 auto;padding:14px 14px 24px}
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 16px 10px;max-width:760px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
  .brand svg{width:30px;height:30px}
  .store{font-size:12px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
  .today{
    max-width:760px;margin:4px auto 0;background:linear-gradient(120deg,#4D96FF,#6FB1FF);
    color:#fff;border-radius:18px;padding:14px 16px;display:flex;align-items:center;
    justify-content:space-between;gap:12px;box-shadow:0 8px 20px rgba(77,150,255,.25)
  }
  .today .t-h{font-size:13px;opacity:.9}
  .today .t-b{font-size:14px;font-weight:700}
  .today .t-go{
    background:#fff;color:var(--primary-d);border:none;border-radius:999px;
    padding:9px 16px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap
  }
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    display:flex;background:#fff;border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
    max-width:760px;margin:0 auto;
  }
  nav.tabs button{
    flex:1;border:none;background:none;padding:10px 0 8px;cursor:pointer;
    color:var(--sub);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  nav.tabs button svg{width:24px;height:24px}
  nav.tabs button.active{color:var(--primary-d);font-weight:800}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 4px 14px rgba(35,48,63,.04)}
  .card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
  .card h3 .bar{width:4px;height:16px;background:var(--primary);border-radius:3px;display:inline-block}
  .seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;max-width:340px;margin:0 auto}
  .seg button{flex:1;border:none;background:none;padding:9px 0;border-radius:999px;font-weight:700;color:var(--sub);cursor:pointer;font-size:15px}
  .seg button.active{background:#fff;color:var(--primary-d);box-shadow:0 2px 6px rgba(0,0,0,.08)}
  /* 周期时间切换 */
  .period-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px auto 0;max-width:340px}
  .period-nav .pn-btn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:50%;font-size:20px;font-weight:800;color:var(--primary-d);cursor:pointer;line-height:1}
  .period-nav .pn-btn:active{background:var(--soft)}
  .period-nav .pn-label{font-size:14px;font-weight:700;color:var(--ink);min-width:120px;text-align:center}
  .period-nav .pn-today{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;padding:7px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
  .period-nav .pn-today:active{background:var(--soft)}
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
  .stat{background:var(--soft);border-radius:14px;padding:12px 8px;text-align:center}
  .stat .v{font-size:20px;font-weight:800;color:var(--primary-d)}
  .stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)}
  .stat .v.t0{color:var(--t0)} .stat .v.t1{color:var(--t1)} .stat .v.t2{color:var(--t2)}
  .stat .l{font-size:12px;color:var(--sub);margin-top:2px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:13px;color:var(--ink)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .chart-flex{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
  .chart-flex .donut-box{flex:1;min-width:180px;text-align:center}
  .chart-flex .legend{flex:1;min-width:200px}
  svg.chart{width:100%;height:auto;display:block}
  label.fld{display:block;margin-bottom:16px}
  label.fld .lab{font-size:14px;font-weight:700;margin-bottom:7px;display:block}
  .req{color:var(--warn)}
  .hint{font-size:12px;color:var(--sub);margin:-4px 0 8px}
  input[type=date],input[type=number]{
    width:100%;padding:12px 12px;border:1px solid var(--line);border-radius:12px;
    font-size:16px;background:#fff;color:var(--ink)
  }
  .radio-row{display:flex;gap:10px}
  .radio-row label{
    flex:1;text-align:center;padding:12px 0;border:1px solid var(--line);border-radius:12px;
    cursor:pointer;font-weight:700;color:var(--sub);background:#fff
  }
  .radio-row input{display:none}
  .radio-row input:checked + span{color:var(--primary-d)}
  .radio-row label:has(input:checked){border-color:var(--primary);background:var(--soft);color:var(--primary-d)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .chip{
    padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;
    font-size:14px;cursor:pointer;color:var(--ink);user-select:none
  }
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
  .chip.custom{background:#FFF3E6;border-color:#FFD9AE;color:var(--accent)}
  .chip .x{margin-left:6px;font-weight:800;opacity:.7}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px}
  .addrow button{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:0 16px;font-weight:700;cursor:pointer}
  .submit{
    width:100%;margin-top:6px;padding:15px;border:none;border-radius:14px;background:var(--primary);
    color:#fff;font-size:17px;font-weight:800;cursor:pointer
  }
  .submit:disabled{opacity:.6}
  .form-err{color:var(--warn);font-size:13px;min-height:18px;margin:-6px 0 10px}
  .toast{
    position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(35,48,63,.92);color:#fff;
    padding:11px 18px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none
  }
  .toast.show{opacity:1}
  /* 照片上传 */
  .upload-btn{
    display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--primary);color:var(--primary-d);
    background:#fff;border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:700;font-size:14px
  }
  .photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .photo-thumb{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#f0f3f8}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer}
  .photo-thumb .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;font-size:13px;line-height:22px;cursor:pointer;padding:0}
  /* 错题本 */
  .list-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:4px}
  .tool-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer}
  .tool-btn.warn{border-color:#FFD0D0;color:var(--warn);background:#FFF5F5}
  .kp-group{margin-top:14px}
  .kp-group h4{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
  .kp-group h4 .cnt{font-size:12px;color:var(--sub);font-weight:600}
  .errcard{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;margin-bottom:10px}
  .errcard .ec-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
  .errcard .ec-date{font-weight:800}
  .errcard .ec-type{font-size:12px;color:#fff;background:var(--primary);border-radius:999px;padding:3px 10px}
  .errcard .ec-sub{font-size:13px;color:var(--sub);margin:6px 0}
  .errcard .ec-photos{display:flex;flex-wrap:wrap;gap:6px}
  .errcard .ec-photos img{width:72px;height:72px;border-radius:10px;object-fit:cover;cursor:pointer;border:1px solid var(--line)}
  .tag-btns{display:flex;gap:6px;margin-top:10px}
  .tag-btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 0;font-size:13px;cursor:pointer;font-weight:700;color:var(--sub)}
  .tag-btn.on.t0{background:var(--t0);border-color:var(--t0);color:#fff}
  .tag-btn.on.t1{background:var(--t1);border-color:var(--t1);color:#fff}
  .tag-btn.on.t2{background:var(--t2);border-color:var(--t2);color:#fff}
  .del{border:none;background:#FFF0F0;color:var(--warn);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
  .rec{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px;background:#fff}
  .rec .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .rec .date{font-weight:800}
  .rec .type{font-size:12px;color:#fff;background:var(--primary);border-radius:999px;padding:3px 10px}
  .rec .meta{font-size:13px;color:var(--sub);margin:6px 0}
  .rec .acc{color:var(--ok);font-weight:700}
  .rec .acc.low{color:var(--warn)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .tag{font-size:12px;background:var(--soft);color:var(--primary-d);border-radius:8px;padding:3px 9px}
  .tag.r{background:#FFF0F0;color:var(--warn)}
  .tag.k{background:#EAFaf3;color:var(--ok)}
  .empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
  /* 图片放大 */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:flex;align-items:center;justify-content:center}
  .lightbox img{max-width:94%;max-height:88%;border-radius:10px}
  .lightbox .lb-close{position:absolute;top:18px;right:22px;width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:22px;cursor:pointer}
  .lightbox .lb-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:14px;background:rgba(255,255,255,.12);padding:10px 16px;border-radius:10px;pointer-events:none}
  [hidden]{display:none!important}
  @media(max-width:560px){
    .summary{grid-template-columns:repeat(2,1fr)}
    .brand{font-size:17px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="#4D96FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.4" fill="#4D96FF" stroke="none"/><path d="M12 7.5 7 13l3 1-1.5 4 5-3-2.5-1 2-3.5z"/><path d="M5 21l3-5M19 21l-3-5"/></svg>
    宝贝Math小跑计划
  </div>
  <div class="store">数据存本机</div>
</header>

<div class="today wrap" id="todayBar" style="max-width:760px">
  <div>
    <div class="t-h">今日速览</div>
    <div class="t-b" id="todayText">今天还没录入哦</div>
  </div>
  <button class="t-go" id="todayGo">去记一笔</button>
</div>

<nav class="tabs">
  <button data-tab="diag" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>诊断
  </button>
  <button data-tab="add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>录入
  </button>
  <button data-tab="book">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h11a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3zM4 5v0M4 5a3 3 0 0 1 3-3h11"/></svg>错题本
  </button>
  <button data-tab="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>记录
  </button>
</nav>

<main class="wrap">
  <!-- 诊断 -->
  <section id="tab-diag">
    <div class="seg" id="seg">
      <button data-p="day" class="active">日</button>
      <button data-p="week">周</button>
      <button data-p="month">月</button>
    </div>
    <div class="period-nav">
      <button id="periodPrev" class="pn-btn" aria-label="上一个">‹</button>
      <span class="pn-label" id="periodLabel"></span>
      <button id="periodNext" class="pn-btn" aria-label="下一个">›</button>
      <button id="periodToday" class="pn-today">回到今/当月</button>
    </div>
    <div class="card" style="margin-top:14px">
      <h3><span class="bar"></span><span id="scopeTitle">今日诊断</span></h3>
      <div class="summary" id="summary"></div>
    </div>
    <div class="card">
      <h3><span class="bar"></span>错题趋势</h3>
      <div id="trend"></div>
    </div>
    <div class="card">
      <h3><span class="bar"></span>错题类型分布</h3>
      <div class="chart-flex">
        <div class="donut-box" id="donutType"></div>
        <div class="legend" id="legendType"></div>
      </div>
    </div>
    <div class="card">
      <h3><span class="bar"></span>知识点分布</h3>
      <div id="barKp"></div>
    </div>
    <div class="card">
      <h3><span class="bar"></span>出错原因分布</h3>
      <div id="barReason"></div>
    </div>
  </section>

  <!-- 录入 -->
  <section id="tab-add" hidden>
    <div class="card">
      <h3><span class="bar"></span>录入一道错题</h3>
      <form id="form" autocomplete="off">
        <label class="fld"><span class="lab">测试时间 <span class="req">*</span></span>
          <input type="date" id="f_date" required></label>
        <label class="fld"><span class="lab">习题类型 <span class="req">*</span></span>
          <div class="radio-row">
            <label><input type="radio" name="ftype" value="专项训练" checked><span>专项训练</span></label>
            <label><input type="radio" name="ftype" value="综合训练"><span>综合训练</span></label>
          </div></label>
        <label class="fld"><span class="lab">错题类型（一级）<span class="req">*</span></span>
          <div class="chips" id="chipsType"></div>
          <div class="addrow"><input id="addType" placeholder="手填新类型，如：时间推理"><button type="button" id="btnAddType">添加</button></div>
          <div class="hint">知识点是其二级选项，选好错题类型后在下方面选</div></label>
        <label class="fld"><span class="lab">知识点（二级，可多选 / 可手填）</span>
          <div class="chips" id="chipsKp"></div>
          <div class="addrow"><input id="addKp" placeholder="手填新知识点，如：找规律"><button type="button" id="btnAddKp">添加</button></div></label>
        <label class="fld"><span class="lab">出错原因（可多选 / 可手填）</span>
          <div class="chips" id="chipsReason"></div>
          <div class="addrow"><input id="addReason" placeholder="手填新原因，如：读题太快"><button type="button" id="btnAddReason">添加</button></div></label>
        <label class="fld"><span class="lab">拍照上传题目（可多张）</span>
          <label class="upload-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            拍照 / 选图
            <input type="file" id="f_photos" accept="image/*" capture="environment" multiple hidden>
          </label>
          <div class="photos" id="photoBox"></div></label>
        <div class="form-err" id="formErr"></div>
        <button type="submit" class="submit" id="submitBtn">保存这道错题</button>
      </form>
    </div>
  </section>

  <!-- 错题本 -->
  <section id="tab-book" hidden>
    <div class="card">
      <h3><span class="bar"></span>按知识点查看错题图片</h3>
      <div id="bookList"></div>
    </div>
  </section>

  <!-- 记录 + 数据 -->
  <section id="tab-list" hidden>
    <div class="list-head">
      <button class="tool-btn" id="exportBtn">导出备份</button>
      <button class="tool-btn" id="importBtn">导入备份</button>
      <button class="tool-btn warn" id="clearBtn">清空全部</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <div id="recordList"></div>
  </section>
</main>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose">×</button>
  <img id="lbImg" alt="题目大图">
  <div class="lb-msg" id="lbMsg" hidden>加载中…</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var LS_KEY = 'mathsprint_records_v2';
  var HIER_KEY = 'mathsprint_hier_v1';
  var SEED_FLAG = 'mathsprint_seeded_v2';
  var PALETTE = ['#4D96FF','#FF9F45','#37C997','#FF6B6B','#A66CFF','#4DCFA8','#FFB84D','#6BCBFF','#FF7FB5','#9C9CFF'];
  var DEFAULT_HIER = {
    '数感':['计算','巧算','图形比大小'],
    '逻辑推理':['枚举','找规律','等量代换'],
    '图形空间':['三视图','图形认知','对称'],
    '综合应用题':['统计图','加减法应用','乘除应用']
  };
  var PRESET = { reasons:['没看题目','题目看不懂','计算粗心','基础概念不清晰','方法不熟练'] };
  var TAGS = ['待复习','已复习','已攻克'];
  var state = { records:[], period:'day', cursor:new Date(), hier:{}, sel:{type:'', kps:[], reasons:[], photos:[]} };

  /* ---------- 工具 ---------- */
  function pad(n){return n<10?'0'+n:''+n;}
  function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
  function num(v){var n=parseFloat(v);return isNaN(n)?0:n;}
  function loadLocal(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'[]');}catch(e){return [];}}
  function saveLocal(a){try{localStorage.setItem(LS_KEY,JSON.stringify(a));}catch(e){ toast('保存空间不足，请导出备份并清理'); }}

  /* 层级 错题类型→知识点 持久化 */
  function loadHier(){ try{ var h=JSON.parse(localStorage.getItem(HIER_KEY)); if(h&&typeof h==='object') return h; }catch(e){} return JSON.parse(JSON.stringify(DEFAULT_HIER)); }
  function saveHier(){ try{ localStorage.setItem(HIER_KEY, JSON.stringify(state.hier)); }catch(e){} }

  /* 表单本地缓存 */
  var FORM_KEY='mathsprint_form_v2', _fcTimer=null;
  function doSaveForm(){
    try{
      localStorage.setItem(FORM_KEY, JSON.stringify({
        date:document.getElementById('f_date').value,
        type:(document.querySelector('input[name=ftype]:checked')||{}).value||'',
        typeSel:state.sel.type, kps:state.sel.kps, reasons:state.sel.reasons
      }));
    }catch(e){}
  }
  function saveFormCache(){ if(_fcTimer) clearTimeout(_fcTimer); _fcTimer=setTimeout(doSaveForm,300); }
  function clearFormCache(){ try{ localStorage.removeItem(FORM_KEY); }catch(e){} }
  function restoreFormCache(){
    try{
      var s=JSON.parse(localStorage.getItem(FORM_KEY)||'null'); if(!s) return;
      if(s.date) document.getElementById('f_date').value=s.date;
      if(s.type){ var rb=document.querySelector('input[name=ftype][value="'+s.type+'"]'); if(rb) rb.checked=true; }
      if(s.typeSel) state.sel.type=s.typeSel;
      if(s.kps) state.sel.kps=s.kps;
      if(s.reasons) state.sel.reasons=s.reasons;

  function importData(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var incoming = JSON.parse(reader.result);
        if(!Array.isArray(incoming)) throw new Error('格式不对');
        var map = {};
        loadLocal().forEach(function(r){ map[r._id] = r; });
        var added = 0;
        incoming.forEach(function(r){
          if(!r || !r.测试时间) return;
          if(!r._id) r._id = 'rec_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
          if(!Array.isArray(r.photos)) r.photos=[];
          if(!r.tag) r.tag='待复习';
          map[r._id] = r; added++;
        });
        saveLocal(Object.keys(map).map(function(k){return map[k];}));
        localStorage.setItem(SEED_FLAG,'1');
        refreshAll();
        toast('已导入 ' + added + ' 条记录');

    };

  /* ---------- 周期范围 ---------- */
  function periodScope(p, cursor){
    cursor = cursor || new Date();
    if(p==='day') return {start:ymd(cursor), end:ymd(cursor), tStart:addDays(cursor,-6), tEnd:cursor, title:'当日诊断', label:ymd(cursor).replace(/-/g,'/')};
    if(p==='week'){
      var dow=(cursor.getDay()+6)%7, mon=addDays(cursor,-dow), sun=addDays(mon,6);
      return {start:ymd(mon), end:ymd(sun), tStart:mon, tEnd:sun, title:'本周诊断', label:ymd(mon).slice(5).replace('-','/')+' ~ '+ymd(sun).slice(5).replace('-','/')};
    }
    var first=new Date(cursor.getFullYear(),cursor.getMonth(),1), last=new Date(cursor.getFullYear(),cursor.getMonth()+1,0);
    return {start:ymd(first), end:ymd(last), tStart:first, tEnd:last, title:'本月诊断', label:cursor.getFullYear()+'年'+(cursor.getMonth()+1)+'月'};
  }

  /* ---------- 统计 ---------- */
  function inScope(r, sc){var d=r.测试时间;return d>=sc.start && d<=sc.end;}
  function tally(field, recs){
    var m={};
    recs.forEach(function(r){
      (r[field]||'').split('、').forEach(function(t){t=t.trim(); if(t) m[t]=(m[t]||0)+1;});
    });
    return m;
  }
  function toSegs(m){
    var arr=Object.keys(m).map(function(k){return {label:k,value:m[k]};});
    arr.sort(function(a,b){return b.value-a.value;});
    arr.forEach(function(s,i){s.color=PALETTE[i%PALETTE.length];});
    return arr;
  }

  /* ---------- 图表 ---------- */
  function donut(segs, centerLabel, centerVal){
    var size=180,r=66,w=22,cx=size/2,cy=size/2,C=2*Math.PI*r;
    var total=segs.reduce(function(a,s){return a+s.value;},0);
    if(total===0) return '<svg class="chart" viewBox="0 0 '+size+' '+size+'" style="max-width:200px;margin:0 auto">'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#EEF1F6" stroke-width="'+w+'"/>'+
      '<text x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="central" fill="#9AA7B8" font-size="13">暂无数据</text></svg>';
    var off=0,parts='';
    segs.forEach(function(s){
      var len=s.value/total*C;
      parts+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="'+w+
        ' stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+
        '" transform="rotate(-90 '+cx+' '+cy+')"/>';
      off+=len;
    });
    return '<svg class="chart" viewBox="0 0 '+size+' '+size+'" style="max-width:200px;margin:0 auto">'+
      parts+'<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" fill="#23303F" font-size="22" font-weight="800">'+centerVal+'</text>'+
      '<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" fill="#7C8AA0" font-size="11">'+centerLabel+'</text></svg>';
  }
  function legendHTML(segs){
    if(!segs.length) return '<span style="color:#9AA7B8">暂无数据</span>';
    return segs.map(function(s){return '<span><i style="background:'+s.color+'"></i>'+s.label+' · '+s.value+'</span>';}).join('');
  }
  function hbar(segs){
    if(!segs.length) return '<div style="color:#9AA7B8;font-size:13px">暂无数据</div>';
    var max=Math.max.apply(null,segs.map(function(s){return s.value;}).concat([1]));
    var lw=84, bw=200, rowH=30, gap=10, h=segs.length*(rowH+gap);
    var bars='';
    segs.forEach(function(s,i){
      var y=i*(rowH+gap), w=Math.max(4,Math.round(s.value/max*bw));
      bars+='<text x="0" y="'+(y+rowH/2+4)+'" font-size="13" fill="#23303F">'+s.label+'</text>';
      bars+='<rect x="'+lw+'" y="'+y+'" width="'+bw+'" height="'+rowH+'" rx="8" fill="#EEF1F6"/>';
      bars+='<rect x="'+lw+'" y="'+y+'" width="'+w+'" height="'+rowH+'" rx="8" fill="'+s.color+'"/>';
      bars+='<text x="'+(lw+bw+8)+'" y="'+(y+rowH/2+4)+'" font-size="13" fill="#7C8AA0">'+s.value+'</text>';
    });
    return '<svg class="chart" viewBox="0 0 '+(lw+bw+40)+' '+h+'" style="max-width:420px">'+bars+'</svg>';
  }
  function vbar(items){
    if(!items.length) return '<div style="color:#9AA7B8;font-size:13px">暂无数据</div>';
    var max=Math.max.apply(null,items.map(function(it){return it.v;}).concat([1]));
    var n=items.length, bw=26, gap=Math.min(16,(320/n)), baseH=150, x0=8, totalW=n*(bw+gap);
    var svgH=baseH+28, bars='';
    items.forEach(function(it,i){
      var x=x0+i*(bw+gap), bh=Math.round(it.v/max*(baseH-20));
      var y=baseH-bh;
      bars+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="6" fill="#4D96FF"/>';
      if(it.v>0) bars+='<text x="'+(x+bw/2)+'" y="'+(y-4)+'" text-anchor="middle" font-size="11" fill="#7C8AA0">'+it.v+'</text>';
      bars+='<text x="'+(x+bw/2)+'" y="'+(baseH+16)+'" text-anchor="middle" font-size="10" fill="#9AA7B8">'+it.label+'</text>';
    });
    return '<svg class="chart" viewBox="0 0 '+totalW+' '+svgH+'" style="max-width:560px">'+bars+'</svg>';
  }

  function bindAdd(kind, inputId, btnId){

      var v=document.getElementById(inputId).value.trim();

      if(kind==='type'){

        saveHier(); state.sel.type=v; state.sel.kps=[];
      } else if(kind==='kp'){
        if(!state.sel.type){ toast('请先选错题类型'); return; }
        if((state.hier[state.sel.type]||[]).indexOf(v)<0) state.hier[state.sel.type].push(v);
        saveHier();
        if(state.sel.kps.indexOf(v)<0) state.sel.kps.push(v);
      } else {
        if(state.sel.reasons.indexOf(v)<0) state.sel.reasons.push(v);
      }
      document.getElementById(inputId).value='';
      renderTypeChips(); renderKpChips(); renderReasonChips(); saveFormCache();
    }
    document.getElementById(btnId).addEventListener('click',add);
    document.getElementById(inputId).addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();add();} });
  }

  /* ---------- 照片：压缩后内联 ---------- */
  function compressFile(file){
    return new Promise(function(res){
      var reader=new FileReader();
      reader.onload=function(){
        var img=new Image();
        img.onload=function(){
          var max=900, w=img.width, h=img.height;
          if(w>h && w>max){ h=Math.round(h*max/w); w=max; }
          else if(h>max){ w=Math.round(w*max/h); h=max; }
          var c=document.createElement('canvas'); c.width=w; c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          res({id:'ph_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), name:file.name, data:c.toDataURL('image/jpeg',0.7)});
        };
        img.onerror=function(){ res({id:'ph_'+Date.now(), name:file.name, data:reader.result}); };
        img.src=reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('img'),function(img){
      img.addEventListener('click',function(){ openLight(img.getAttribute('src')); });
    });
    Array.prototype.forEach.call(box.querySelectorAll('.rm'),function(b){
      b.addEventListener('click',function(){
        state.sel.photos.splice(parseInt(b.getAttribute('data-i'),10),1);
        renderPhotos();
      });
    });
  }

  function toast(msg){
    var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); },1800);
  }

  /* ---------- 刷新 ---------- */
  function refreshAll(){
    try { state.records = loadAll(); } catch(e){ state.records = state.records || []; }
    renderToday(); renderDiagnostics(); renderList();
    if(!document.getElementById('tab-book').hidden) renderBook();
    return Promise.resolve();
  }

  /* ---------- 事件 ---------- */
  function bindTabs(){
    Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'),function(b){
      b.addEventListener('click',function(){
        var tab=b.getAttribute('data-tab');
        Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'),function(x){x.classList.remove('active');});
        b.classList.add('active');
        ['diag','add','book','list'].forEach(function(k){ document.getElementById('tab-'+k).hidden = (k!==tab); });
        document.getElementById('todayBar').hidden = (tab!=='diag');
        if(tab==='diag') renderDiagnostics();
        if(tab==='book') renderBook();
      });
    });
    document.getElementById('todayGo').addEventListener('click',function(){
      document.querySelector('nav.tabs button[data-tab="add"]').click();
    });
  }
  function bindSeg(){
    Array.prototype.forEach.call(document.querySelectorAll('#seg button'),function(b){
      b.addEventListener('click',function(){
        Array.prototype.forEach.call(document.querySelectorAll('#seg button'),function(x){x.classList.remove('active');});
        b.classList.add('active');
        state.period=b.getAttribute('data-p');
        state.cursor=new Date();
        renderDiagnostics();
      });
    });
  }
  function shiftCursor(unit, delta){
    var c=new Date(state.cursor);
    if(unit==='day') c.setDate(c.getDate()+delta);
    else if(unit==='week') c.setDate(c.getDate()+delta*7);
    else c.setMonth(c.getMonth()+delta);
    state.cursor=c;
  }
  function bindPeriodNav(){
    document.getElementById('periodPrev').addEventListener('click',function(){ shiftCursor(state.period,-1); renderDiagnostics(); });
    document.getElementById('periodNext').addEventListener('click',function(){ shiftCursor(state.period,1); renderDiagnostics(); });
    document.getElementById('periodToday').addEventListener('click',function(){ state.cursor=new Date(); renderDiagnostics(); });
  }
  function bindForm(){
    state.hier = loadHier();
    document.getElementById('f_date').value = ymd(new Date());
    restoreFormCache();
    renderTypeChips(); renderKpChips(); renderReasonChips();
    bindAdd('type','addType','btnAddType');
    bindAdd('kp','addKp','btnAddKp');
    bindAdd('reason','addReason','btnAddReason');
    var photoInput=document.getElementById('f_photos');
    photoInput.addEventListener('change',function(e){
      var files=e.target.files; if(!files||!files.length) return;
      Array.prototype.forEach.call(files,function(f){
        compressFile(f).then(function(p){ state.sel.photos.push(p); renderPhotos(); });
      });
      e.target.value='';
    });
    document.getElementById('f_date').addEventListener('change', saveFormCache);
    Array.prototype.forEach.call(document.querySelectorAll('input[name=ftype]'),function(rb){ rb.addEventListener('change', saveFormCache); });
    document.getElementById('form').addEventListener('submit',function(e){
      e.preventDefault();
      var err=document.getElementById('formErr');
      var date=document.getElementById('f_date').value;
      var type=document.querySelector('input[name=ftype]:checked').value;
      if(!date){err.textContent='请选择测试时间';return;}
      if(!state.sel.type){err.textContent='请选择错题类型';return;}
      var btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='保存中…';
      var photos=state.sel.photos.map(function(p){return {id:p.id,name:p.name,data:p.data};});
      addRecord({
        测试时间:date, 习题类型:type,
        错题类型:state.sel.type, 知识点:state.sel.kps.join('、'), 出错原因:state.sel.reasons.join('、'),
        photos:photos
      }).then(function(){
        btn.disabled=false; btn.textContent='保存这道错题';
        clearFormCache();
        state.sel={type:'',kps:[],reasons:[],photos:[]};
        renderTypeChips(); renderKpChips(); renderReasonChips(); renderPhotos();
        toast('已保存到本机 ✓');
        document.querySelector('nav.tabs button[data-tab="diag"]').click();
      });
    });
  }
  function bindData(){
    document.getElementById('exportBtn').addEventListener('click', exportData);
    document.getElementById('clearBtn').addEventListener('click', clearAll);
    var fileInput=document.getElementById('importFile');
    document.getElementById('importBtn').addEventListener('click',function(){ fileInput.click(); });
    fileInput.addEventListener('change',function(e){
      var f=e.target.files && e.target.files[0];
      if(f) importData(f);
      e.target.value='';
    });
    document.getElementById('lbClose').addEventListener('click',function(){
      document.getElementById('lightbox').hidden=true;
      document.getElementById('lbImg').src='';
    });
    document.getElementById('lightbox').addEventListener('click',function(e){ if(e.target.id==='lightbox'){ this.hidden=true; document.getElementById('lbImg').src=''; } });
  }

  /* ---------- Service Worker 注册（离线/可安装） ---------- */
  var SW_VER = 'v6';
  function registerSW(){
    if(!('serviceWorker' in navigator)) return;
    if(location.protocol!=='https:' && location.hostname!=='localhost' && location.hostname!=='127.0.0.1') return;
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('./sw.js?v=' + SW_VER)
        .then(function(reg){ reg.update(); })
        .catch(function(){});
    });
    navigator.serviceWorker.addEventListener('controllerchange',function(){ window.location.reload(); });
  }

document.addEventListener('DOMContentLoaded',function(){
  bindTabs(); bindSeg(); bindPeriodNav(); bindForm(); bindData();
  registerSW();
  refreshAll();
});
})();
</script>
</body>
</html>
